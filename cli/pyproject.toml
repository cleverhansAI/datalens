[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datalens-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "httpx>=0.27.0"
]

[project.scripts]
datalens = "datalens_cli.main:app"

[tool.setuptools]
packages = ["datalens_cli"]
