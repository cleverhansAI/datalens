[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datalens"
version = "0.1.0"
description = "DataLens: computer vision dataset exploration and curation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "fsspec>=2024.6.0",
  "s3fs>=2024.6.0",
  "pillow>=10.4.0",
  "numpy>=2.0.0",
  "pyarrow>=17.0.0",
  "imagehash>=4.3.1",
  "duckdb>=1.0.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.3",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.6",
  "mypy>=1.11.1"
]
ml = [
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "faiss-cpu>=1.8.0.post1"
]

[project.scripts]
datalens = "datalens_cli.main:app"
datalens-server = "datalens.server:main"

[tool.setuptools.packages.find]
where = ["backend", "cli", "sdk/python"]
include = ["app*", "datalens*", "datalens_cli*"]

[tool.setuptools.package-data]
datalens = ["ui/**/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
